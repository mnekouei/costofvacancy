[project]
name = "cost-of-vacancy"
version = "0.1.0"
description = "Estimate the annual cost of a vacant specialty position at a hospital using CMS Medicare billing data."
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[project.scripts]
cost-of-vacancy = "cost_of_vacancy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cost_of_vacancy*"]

[tool.setuptools.package-data]
cost_of_vacancy = ["fixtures/*.json"]
